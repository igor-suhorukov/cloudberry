# The port's Compose project.  Nothing is installed on the host.
#
#   docker compose -f pg19/docker/compose.yml build
#   docker compose -f pg19/docker/compose.yml run --rm tests
#
# The two repositories are passed as build contexts, so the paths below are the
# only thing to change if they live somewhere else:
#
#   PG_SRC=/path/to/postgres CB_SRC=/path/to/cloudberry docker compose ... build

name: cloudberry-pg19

services:
  # Vanilla PostgreSQL 19, from the same commit the patch series is based on.
  # It is the reference for every "is the server still vanilla" comparison.
  pg19-vanilla:
    image: cloudberry/pg19-vanilla:latest
    build:
      context: .
      dockerfile: Dockerfile.pg
      additional_contexts:
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_REF: ${PG_VANILLA_REF:-origin/REL_19_STABLE}
    profiles: ["compare"]

  # The same tree with the core patch series applied.
  pg19-patched:
    image: cloudberry/pg19-patched:latest
    build:
      context: .
      dockerfile: Dockerfile.pg
      additional_contexts:
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_REF: ${PG_PATCHED_REF:-REL_19_STABLE_CLOUDBERRY}

  # The two again without assertions, for check 9, which counts a workload's
  # instructions: no production server runs an assertion's, and they would
  # thin out a hook's share of the count.
  pg19-vanilla-noassert:
    image: cloudberry/pg19-vanilla-noassert:latest
    build:
      context: .
      dockerfile: Dockerfile.pg
      additional_contexts:
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_REF: ${PG_VANILLA_REF:-origin/REL_19_STABLE}
        PG_CASSERT: "false"
    profiles: ["compare"]

  pg19-patched-noassert:
    image: cloudberry/pg19-patched-noassert:latest
    build:
      context: .
      dockerfile: Dockerfile.pg
      additional_contexts:
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_REF: ${PG_PATCHED_REF:-REL_19_STABLE_CLOUDBERRY}
        PG_CASSERT: "false"
    profiles: ["compare", "tpc"]

  # The port's modules, on top of the patched server.
  cb-ext:
    image: cloudberry/cb-ext:latest
    depends_on: [pg19-patched]
    build:
      context: .
      dockerfile: Dockerfile.cbext
      additional_contexts:
        cbsrc: ${CB_SRC:-../..}
        # PostgreSQL's own regression suite, taken at the commit the server
        # image was built from; see Dockerfile.cbext.
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_IMAGE: cloudberry/pg19-patched:latest
        CB_REF: ${CB_REF:-extension_postgresql_19}

  # The port's test suites.  With no argument it runs them all, as jobs side
  # by side (pg19/test/run.sh says how).
  #
  #   docker compose -f pg19/docker/compose.yml run --rm tests load
  #
  # The jobs start some sixty servers at once, and each puts its dynamic
  # shared memory in /dev/shm, which is 64 MB unless the container is given
  # more.  Privileged, and started as root, for the resource group suite: the
  # entrypoint makes cgroup v2 subtrees of the container's own cgroup
  # namespace the tests' to write -- /sys/fs/cgroup/gpdb_<pass>_<group>, a
  # cgroup parent for each of that suite's jobs, and jobs, a cgroup for each
  # job of the run, which says its CPU time -- and then runs the suites as
  # postgres (pg19/test/cgroup.sh).  Without it that suite skips.
  # The volume is a disk for that suite's clusters, whose I/O limits name
  # the disk a directory is on; run --rm removes it with the container.
  tests:
    image: cloudberry/cb-ext:latest
    depends_on: [cb-ext]
    user: root
    privileged: true
    entrypoint: ["/cb/pg19/test/cgroup.sh"]
    shm_size: 4gb
    tmpfs:
      - /tmp
    # The servers keep their data, WAL and shared buffers in memory -- /tmp
    # is a tmpfs -- and the run starts jobs while there is memory for them
    # (test/run.sh, MEM= in test/jobs): within this limit, so that a run that
    # still wants more is the one its OOM kills, not the machine's other
    # processes.  No swap.
    mem_limit: ${CB_TESTS_MEM:-40g}
    memswap_limit: ${CB_TESTS_MEM:-40g}
    volumes:
      - /var/lib/cbdisk

  # The port without assertions, for timing: the modules built against the
  # patched server built without them, which leaves ORCA's own checks
  # (GPOS_DEBUG) out too.  Only with the tpc profile.
  cb-ext-noassert:
    image: cloudberry/cb-ext-noassert:latest
    depends_on: [pg19-patched-noassert]
    profiles: ["tpc"]
    build:
      context: .
      dockerfile: Dockerfile.cbext
      additional_contexts:
        cbsrc: ${CB_SRC:-../..}
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_IMAGE: cloudberry/pg19-patched-noassert:latest
        CB_REF: ${CB_REF:-extension_postgresql_19}

  # TPC-H's and TPC-DS's queries on a cluster of the port without
  # assertions, each timed under ORCA and under the planner's route, and
  # each answer checked against DuckDB's (pg19/test/tpc/run.sh says how,
  # and what the TPC_ settings change):
  #
  #   docker compose -f pg19/docker/compose.yml --profile tpc build pg19-patched-noassert cb-ext-noassert
  #   docker compose -f pg19/docker/compose.yml --profile tpc run --rm tpc
  #
  # The data and the servers are in /tmp, a tmpfs, as the tests service's.
  tpc:
    image: cloudberry/cb-ext-noassert:latest
    depends_on: [cb-ext-noassert]
    profiles: ["tpc"]
    user: postgres
    entrypoint: ["/cb/pg19/test/run.sh", "tpc"]
    environment:
      CB_TPC: time
    shm_size: 4gb
    tmpfs:
      - /tmp
    mem_limit: ${CB_TESTS_MEM:-40g}
    memswap_limit: ${CB_TESTS_MEM:-40g}

  # Does the patched server still behave like vanilla PostgreSQL 19?  It runs
  # both builds against each other and loads no Cloudberry module.  Check 10
  # reads the patch series, so the PostgreSQL repository is mounted read-only.
  #
  #   docker compose -f pg19/docker/compose.yml run --rm compare
  #   docker compose -f pg19/docker/compose.yml run --rm compare 03 05
  compare:
    image: cloudberry/pg19-compare:latest
    depends_on: [pg19-vanilla, pg19-patched, pg19-vanilla-noassert, pg19-patched-noassert]
    build:
      context: .
      dockerfile: Dockerfile.compare
      additional_contexts:
        cbsrc: ${CB_SRC:-../..}
      args:
        PG_VANILLA_IMAGE: cloudberry/pg19-vanilla:latest
        PG_PATCHED_IMAGE: cloudberry/pg19-patched:latest
        PG_VANILLA_NOASSERT_IMAGE: cloudberry/pg19-vanilla-noassert:latest
        PG_PATCHED_NOASSERT_IMAGE: cloudberry/pg19-patched-noassert:latest
        CB_REF: ${CB_REF:-extension_postgresql_19}
    volumes:
      - ${PG_SRC:-../../../postgres}:/pgsrc:ro
    tmpfs:
      - /tmp
    profiles: ["compare"]

  # Check 1: PostgreSQL's own tests, meson test, in each build's tree -- the
  # build stage of the images above, which keeps it.  pg19/test/vanilla/
  # meson.sh runs them, as a user of its own since initdb refuses root, and
  # lists each test with its result: the two lists have to be the same.
  # It is mounted from the working tree, as the build stage has no port.
  #
  #   docker compose -f pg19/docker/compose.yml run --rm meson-vanilla > vanilla.txt
  #   docker compose -f pg19/docker/compose.yml run --rm meson-patched > patched.txt
  meson-vanilla:
    image: cloudberry/pg19-vanilla-build:latest
    build:
      context: .
      dockerfile: Dockerfile.pg
      target: build
      additional_contexts:
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_REF: ${PG_VANILLA_REF:-origin/REL_19_STABLE}
    user: root
    entrypoint: ["bash", "/vanilla/meson.sh"]
    volumes:
      - ../test/vanilla:/vanilla:ro
    shm_size: 4gb
    profiles: ["meson"]

  meson-patched:
    image: cloudberry/pg19-patched-build:latest
    build:
      context: .
      dockerfile: Dockerfile.pg
      target: build
      additional_contexts:
        pgsrc: ${PG_SRC:-../../../postgres}
      args:
        PG_REF: ${PG_PATCHED_REF:-REL_19_STABLE_CLOUDBERRY}
    user: root
    entrypoint: ["bash", "/vanilla/meson.sh"]
    volumes:
      - ../test/vanilla:/vanilla:ro
    shm_size: 4gb
    profiles: ["meson"]

  # The binary release, as .github/workflows/pg19-release.yml builds it
  # (Dockerfile.release): the build stage, whose /dist holds the packages,
  # for RELEASE_BASE's distribution.  Out of the image, then installed on a
  # clean system of that distribution and every module loaded:
  #
  #   docker compose -f pg19/docker/compose.yml --profile release build release
  #   docker run --rm -u "$(id -u)" -v "$PWD/dist:/out" cloudberry/pg19-release:latest cp -r /dist/. /out/
  #   docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/pg19:/pg19:ro" debian:trixie-slim bash /pg19/release/smoke.sh
  release:
    image: cloudberry/pg19-release:latest
    build:
      context: .
      dockerfile: Dockerfile.release
      target: build
      additional_contexts:
        pgsrc: ${PG_SRC:-../../../postgres}
        cbsrc: ${CB_SRC:-../..}
      args:
        BASE_IMAGE: ${RELEASE_BASE:-debian:trixie-slim}
        PG_REF: ${PG_PATCHED_REF:-REL_19_STABLE_CLOUDBERRY}
        CB_REF: ${CB_REF:-extension_postgresql_19}
        VERSION: ${RELEASE_VERSION:-}
    profiles: ["release"]

  # A coordinator, a standby coordinator and two segment hosts with mirrors --
  # the topology of Cloudberry's own sandbox.  It arrives with M2, which is the
  # first milestone that has anything to dispatch; see cloudberry.md,
  # "Milestones".
